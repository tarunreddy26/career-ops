# Render Blueprint — Oshi AI VTuber TTS Microservice
# Render reads this file to auto-configure the web service.
# Secret env vars (API keys) must be set manually in the dashboard.

services:
  - type: web
    name: oshi-ai-vtuber-tts
    runtime: node
    region: ohio  # Closest to ElevenLabs servers (us-east-1 equivalent)
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: ELEVENLABS_API_KEY
        sync: false  # Set manually in Render dashboard (secret)
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_MODEL_ID
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false  # Set to frontend domain(s), comma-separated
